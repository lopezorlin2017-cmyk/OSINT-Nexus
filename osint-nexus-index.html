<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e18">
  <meta name="description" content="OSINT Nexus - Plataforma de análisis e investigación digital.">
  <title>OSINT Nexus</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080e18;
      --panel: #111d2c;
      --panel-2: #132e47;
      --border: #29394c;
      --blue: #54b9ff;
      --muted: #91a4ba;
      --white: #f4f8fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: max(22px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 0%, #13263c 0%, var(--bg) 48%);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { width: 100%; max-width: 520px; margin: 0 auto; }
    header { text-align: center; padding: 14px 0 22px; }
    .logo {
      width: 62px; height: 62px; margin: 0 auto 12px; border-radius: 19px;
      display: grid; place-items: center; color: var(--blue);
      background: #132a43; border: 1px solid #244665;
    }
    .logo svg { width: 34px; height: 34px; }
    h1 { margin: 0; font-size: 27px; letter-spacing: 2.2px; font-weight: 750; }
    .subtitle { color: var(--muted); font-size: 10px; letter-spacing: 1.35px; margin-top: 7px; }
    .status {
      display: inline-block; margin-top: 12px; padding: 5px 10px; border-radius: 20px;
      color: #8bd5ff; background: #10283e; border: 1px solid #244665; font-size: 11px;
    }
    .section-head { display: flex; justify-content: space-between; align-items: end; margin: 7px 1px 12px; }
    h2 { font-size: 17px; margin: 0; }
    .hint { color: var(--muted); font-size: 11px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    button { font: inherit; cursor: pointer; }
    .module {
      min-height: 106px; text-align: left; padding: 13px; border-radius: 13px;
      color: var(--white); background: linear-gradient(145deg, #142337, #101a28);
      border: 1px solid var(--border); transition: border-color .15s, transform .15s;
    }
    .module:active, .case:active { transform: scale(.985); }
    .module:hover, .module:focus-visible { border-color: #388cc5; outline: none; }
    .module svg { width: 23px; height: 23px; color: var(--blue); display: block; margin-bottom: 10px; }
    .module strong { display: block; font-size: 13px; font-weight: 650; }
    .module span { display: block; color: var(--muted); font-size: 10px; line-height: 1.4; margin-top: 4px; }
    .case {
      width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
      margin-top: 13px; padding: 14px; border-radius: 13px; color: var(--white);
      background: linear-gradient(110deg, #15334e, #11263b); border: 1px solid #287cb7;
    }
    .case-icon { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; background: #1a4566; color: #63c5ff; }
    .case-icon svg { width: 22px; height: 22px; }
    .case strong { display: block; font-size: 13px; }
    .case small { display: block; color: #9bb5cc; font-size: 10px; margin-top: 4px; }
    .arrow { margin-left: auto; color: var(--blue); font-size: 22px; }
    .detail {
      display: none; margin-top: 12px; padding: 15px; border: 1px solid #244665;
      border-radius: 12px; background: #14283d;
    }
    .detail.open { display: block; }
    .detail h3 { margin: 0 0 7px; font-size: 15px; }
    .detail p { margin: 0; color: #c3d3e4; font-size: 12px; line-height: 1.55; }
    .detail .note { margin-top: 10px; color: #91a4ba; font-size: 10px; }
    .close { margin-top: 12px; padding: 7px 12px; border-radius: 8px; border: 1px solid #456078; color: white; background: transparent; font-size: 11px; }
    footer { display: flex; justify-content: space-between; color: #71869c; font-size: 9px; letter-spacing: .5px; margin-top: 22px; padding: 0 2px; }
    @media (max-width: 350px) { .grid { gap: 8px; } .module { padding: 11px; min-height: 100px; } h1 { font-size: 24px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5.5"></circle>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
          <path d="M12 1v4M23 12h-4M12 23v-4M1 12h4"></path>
        </svg>
      </div>
      <h1>OSINT NEXUS</h1>
      <div class="subtitle">DIGITAL INTELLIGENCE PLATFORM</div>
      <div class="status">Sistema de análisis e investigación</div>
    </header>

    <div class="section-head">
      <h2>Panel principal</h2>
      <span class="hint">Seleccioná un módulo</span>
    </div>

    <section class="grid" aria-label="Módulos principales">
      <button class="module" data-module="Teléfonos" data-description="Consulta y análisis de información telefónica disponible públicamente. No accede a llamadas, mensajes privados ni datos restringidos.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg>
        <strong>Teléfonos</strong><span>Información pública</span>
      </button>
      <button class="module" data-module="Usuarios" data-description="Organización de búsquedas de nombres de usuario y perfiles que sean públicos.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M19 8v6M22 11h-6"/></svg>
        <strong>Usuarios</strong><span>Perfiles públicos</span>
      </button>
      <button class="module" data-module="Fotografías" data-description="Revisión de imágenes aportadas por el usuario, metadatos disponibles y datos de origen cuando estén presentes.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <strong>Fotografías</strong><span>Metadatos e imágenes</span>
      </button>
      <button class="module" data-module="Geolocalización" data-description="Visualización de coordenadas, puntos y referencias geográficas proporcionadas o disponibles en fuentes autorizadas.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <strong>Geolocalización</strong><span>Coordenadas y mapas</span>
      </button>
      <button class="module" data-module="Telecomunicaciones" data-description="Importación y análisis de registros autorizados con IMSI, IMEI, LAC, CID y MSISDN. Se reutilizarán funciones de Telecom Map.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 21h18M5 21 12 3l7 18M8 14h8M10 9h4M9 18h6"/></svg>
        <strong>Telecomunicaciones</strong><span>IMSI, IMEI, LAC y CID</span>
      </button>
      <button class="module" data-module="Cronología" data-description="Organización por fecha y hora de los eventos y registros incorporados a una investigación.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <strong>Cronología</strong><span>Historial de eventos</span>
      </button>
    </section>

    <button class="case" data-module="Centro de Investigación" data-description="Espacio central para crear expedientes y relacionar registros, fotografías, coordenadas y fuentes públicas, conservando la procedencia y la fecha de cada dato.">
      <span class="case-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7V4h7l2 2h9v14H3z"/><circle cx="11" cy="13" r="3"/><path d="m13.2 15.2 2 2"/></svg>
      </span>
      <span><strong>Centro de Investigación</strong><small>Expedientes y relaciones entre datos</small></span>
      <span class="arrow">›</span>
    </button>

    <section class="detail" id="detail" aria-live="polite">
      <h3 id="detail-title"></h3>
      <p id="detail-description"></p>
      <div class="note">Vista inicial de demostración. Las funciones se implementarán en las siguientes etapas.</div>
      <button class="close" id="close-detail">Cerrar</button>
    </section>

    <footer><span>OSINT NEXUS · V1.0</span><span>INTERFAZ DE PRUEBA</span></footer>
  </main>
  <script>
    const detail = document.getElementById('detail');
    const title = document.getElementById('detail-title');
    const description = document.getElementById('detail-description');
    document.querySelectorAll('[data-module]').forEach(button => {
      button.addEventListener('click', () => {
        title.textContent = button.dataset.module;
        description.textContent = button.dataset.description;
        detail.classList.add('open');
        detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    document.getElementById('close-detail').addEventListener('click', () => {
      detail.classList.remove('open');
    });
  </script>
</body>
</html>
